services:
  - type: web
    name: daily-commit-club-backend
    env: node
    rootDir: daily-commit-club/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: daily-commit-club-frontend
    env: static
    rootDir: daily-commit-club/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
