version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: dcc_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: daily_commit_club

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcc_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/daily_commit_club
      - JWT_SECRET=daily_commit_club_super_secret_jwt_key_2026
      - TIMEZONE=Asia/Kolkata
      - FRONTEND_URL=http://localhost
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dcc_frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  mongo_data:
